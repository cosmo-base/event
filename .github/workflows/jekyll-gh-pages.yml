name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CBED_CSV_URL: ${{ secrets.NEXT_PUBLIC_CBED_CSV_URL }}
          NEXT_PUBLIC_LAUNCHES_CSV_URL: ${{ secrets.NEXT_PUBLIC_LAUNCHES_CSV_URL }}
          NEXT_PUBLIC_CBMD_CSV_URL: ${{ secrets.NEXT_PUBLIC_CBMD_CSV_URL }}
          NEXT_PUBLIC_CMCONSTELLATION_CSV_URL: ${{ secrets.NEXT_PUBLIC_CMCONSTELLATION_CSV_URL }}
          NEXT_PUBLIC_CMROCKETS_CSV_URL: ${{ secrets.NEXT_PUBLIC_CMROCKETS_CSV_URL }}
          NEXT_PUBLIC_EVENT_GAS_URL: ${{ secrets.NEXT_PUBLIC_EVENT_GAS_URL }}
          NEXT_PUBLIC_LIST_SPREADSHEET_URL: ${{ secrets.NEXT_PUBLIC_LIST_SPREADSHEET_URL }}
          NEXT_PUBLIC_FEEDBACK_FORM_URL: ${{ secrets.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
          NEXT_PUBLIC_GAS_URL: ${{ secrets.NEXT_PUBLIC_GAS_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_DRIVE_FOLDER_ID: ${{ secrets.NEXT_PUBLIC_DRIVE_FOLDER_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Test EVENT_GAS_URL (remove after fix)
        if: always()
        run: |
          node -e "
          (async () => {
            const url = process.env.NEXT_PUBLIC_EVENT_GAS_URL;
            console.log('URL set:', !!url, '/ length:', url ? url.length : 0);
            if (!url) { console.log('SECRET NOT SET'); return; }
            console.log('URL prefix:', url.slice(0, 60));
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ type: 'pageview', eventId: '_ci_test_' }),
              });
              console.log('status:', res.status, res.statusText);
              const t = await res.text();
              console.log('body:', t.slice(0, 300));
            } catch(e) { console.error('fetch error:', e.message); }
          })();
          "
        env:
          NEXT_PUBLIC_EVENT_GAS_URL: ${{ secrets.NEXT_PUBLIC_EVENT_GAS_URL }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
