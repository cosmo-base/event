name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CBED_CSV_URL: ${{ secrets.NEXT_PUBLIC_CBED_CSV_URL }}
          NEXT_PUBLIC_LAUNCHES_CSV_URL: ${{ secrets.NEXT_PUBLIC_LAUNCHES_CSV_URL }}
          NEXT_PUBLIC_CBMD_CSV_URL: ${{ secrets.NEXT_PUBLIC_CBMD_CSV_URL }}
          NEXT_PUBLIC_CMCONSTELLATION_CSV_URL: ${{ secrets.NEXT_PUBLIC_CMCONSTELLATION_CSV_URL }}
          NEXT_PUBLIC_CMROCKETS_CSV_URL: ${{ secrets.NEXT_PUBLIC_CMROCKETS_CSV_URL }}
          NEXT_PUBLIC_EVENT_GAS_URL: ${{ secrets.NEXT_PUBLIC_EVENT_GAS_URL }}
          NEXT_PUBLIC_LIST_SPREADSHEET_URL: ${{ secrets.NEXT_PUBLIC_LIST_SPREADSHEET_URL }}
          NEXT_PUBLIC_FEEDBACK_FORM_URL: ${{ secrets.NEXT_PUBLIC_FEEDBACK_FORM_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
