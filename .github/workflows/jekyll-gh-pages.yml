name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CBED_CSV_URL: ${{ secrets.NEXT_PUBLIC_CBED_CSV_URL }}
          NEXT_PUBLIC_LAUNCHES_CSV_URL: ${{ secrets.NEXT_PUBLIC_LAUNCHES_CSV_URL }}
          NEXT_PUBLIC_CBMD_CSV_URL: ${{ secrets.NEXT_PUBLIC_CBMD_CSV_URL }}
          NEXT_PUBLIC_CMCONSTELLATION_CSV_URL: ${{ secrets.NEXT_PUBLIC_CMCONSTELLATION_CSV_URL }}
          NEXT_PUBLIC_CMROCKETS_CSV_URL: ${{ secrets.NEXT_PUBLIC_CMROCKETS_CSV_URL }}
          NEXT_PUBLIC_EVENT_GAS_URL: ${{ secrets.NEXT_PUBLIC_EVENT_GAS_URL }}
          NEXT_PUBLIC_LIST_SPREADSHEET_URL: ${{ secrets.NEXT_PUBLIC_LIST_SPREADSHEET_URL }}
          NEXT_PUBLIC_FEEDBACK_FORM_URL: ${{ secrets.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
          NEXT_PUBLIC_GAS_URL: ${{ secrets.NEXT_PUBLIC_GAS_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_DRIVE_FOLDER_ID: ${{ secrets.NEXT_PUBLIC_DRIVE_FOLDER_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Debug CBMD GAS result
        if: always()
        run: |
          echo "=== CBMD GAS DEBUG ==="
          if [ -z "$NEXT_PUBLIC_GAS_URL" ]; then
            echo "NEXT_PUBLIC_GAS_URL: EMPTY (secret not set)"
          else
            echo "NEXT_PUBLIC_GAS_URL: set (${#NEXT_PUBLIC_GAS_URL} chars)"
            echo "Fetching GAS publicEvent for CMCdemoDay..."
            curl -sf --max-time 15 "${NEXT_PUBLIC_GAS_URL}?action=publicEvent&id=CMCdemoDay" -o /tmp/gas.json 2>&1 && \
              python3 -c "import json,sys; d=json.load(open('/tmp/gas.json')); print('cbmdPrefectures:', repr(d.get('cbmdPrefectures','')))" || \
              echo "curl/parse failed"
          fi
          HTML=./out/CMCdemoDay/cbmd/index.html
          if [ -f "$HTML" ]; then
            echo "Built HTML data-cbmd-gas:"
            grep -oP 'data-cbmd-gas="[^"]*"' "$HTML" | head -1 || echo "(attribute not found)"
            grep -oP 'data-cbmd-prefectures="[^"]*"' "$HTML" | head -1 || echo "(attribute not found)"
          fi
        env:
          NEXT_PUBLIC_GAS_URL: ${{ secrets.NEXT_PUBLIC_GAS_URL }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
